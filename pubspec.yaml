name: sonah
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  adhan: ^2.0.0+1
  android_intent_plus: ^6.0.0
  battery_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  expandable_page_view: ^1.3.0
  dynamic_color: ^1.8.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_contacts: ^2.2.2
  flutter_device_apps: ^0.8.1
  flutter_localizations:
    sdk: flutter
  fluttertoast: ^9.1.0
  geolocator: ^14.0.3
  go_router: ^17.3.0
  hijri: ^3.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  location: ^8.0.1
  lucide_icons_flutter: ^3.1.14
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  share_plus: ^13.1.0
  url_launcher: ^6.3.2
  usage_stats: ^2.0.1
  vibration: ^3.2.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/mi.ttf
    - family: kage
      fonts:
        - asset: assets/fonts/kage_demi_bold.ttf
          weight: 700
        - asset: assets/fonts/kage_semi_bold.ttf
          weight: 600
        - asset: assets/fonts/kage_extra_light.ttf
          weight: 200

flutter_native_splash:
  color: "#161618"
  image: assets/icon_white.png
  android_12:
    image: assets/icon_white.png
    color: "#161618"

flutter_intl:
  enabled: true
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"
  adaptive_icon_monochrome: "assets/icon.png"
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48

  linux:
    generate: true
    image_path: "assets/icon.png"
